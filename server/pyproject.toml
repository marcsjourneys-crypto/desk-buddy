[project]
name = "desk-buddy"
version = "0.1.0"
description = "Server brain for the Desk Buddy desk robot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "comtypes>=1.5.0",
    "fastapi>=0.165.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.5",
    "piper-tts==1.8.0",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# The Microsoft Store Python can't open microphones (its app package has no
# mic capability), so always use uv's own standalone Python builds.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs real audio/COM, models or network; run with `uv run pytest -m integration`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
